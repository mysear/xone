curve25519-dalek = "4.1"
xone-kafka-transport = { path = "../kafka-transport" }
xone-control = { path = "../control" }

prost.workspace = true
tonic = { version = "0.14.2", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots", "codegen", "router"] }
